name: Test Notebooks

on:
  push:
    paths:
      - 'notebooks/**.ipynb'
  pull_request:
  workflow_dispatch:

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert matplotlib numpy

      - name: Execute notebooks
        env:
          MPLBACKEND: Agg  # headless matplotlib
        run: |
          mkdir -p data
          failed=0
          for nb in notebooks/*.ipynb; do
            echo ""
            echo "============================================"
            echo "=== Running: $nb ==="
            echo "============================================"
            if jupyter nbconvert --to notebook --execute \
                --ExecutePreprocessor.timeout=180 \
                --ExecutePreprocessor.allow_errors=False \
                "$nb" \
                --output "$(basename $nb .ipynb)_executed.ipynb" \
                --output-dir /tmp/test_output 2>&1; then
              echo "✅ $nb PASSED"
            else
              echo "❌ $nb FAILED"
              failed=1
            fi
          done
          echo ""
          if [ $failed -eq 0 ]; then
            echo "🎉 All notebooks executed successfully!"
          else
            echo "💥 Some notebooks failed. Check logs above."
            exit 1
          fi
